name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # keyless 签名需要 OIDC

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建安装包
        run: npx electron-builder --win nsis --x64

      - name: 生成 SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Where-Object { $_.Name -notmatch '__uninstaller' } | Select-Object -First 1
          $h = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($exe.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          Write-Host "SHA256 = $h"

      - name: 安装 cosign
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sigstore/cosign/releases/latest/download/cosign-windows-amd64.exe" -OutFile cosign.exe
          .\cosign.exe version

      - name: Sigstore 签名（keyless）
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Where-Object { $_.Name -notmatch '__uninstaller' } | Select-Object -First 1
          .\cosign.exe sign-blob --yes --bundle "$($exe.FullName).bundle" $exe.FullName

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.bundle
            dist/SHA256SUMS.txt
          generate_release_notes: true
