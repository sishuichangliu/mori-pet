name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # keyless 签名需要 OIDC

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建安装包
        shell: pwsh
        run: |
          # 输出同时进控制台和 build.log；失败时把结尾逐行打成注解，
          # 这样即使打不开 Actions 页面，也能通过 check-runs API 读到原因
          npx electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::electron-builder 退出码 $code"
            Get-Content build.log -Tail 25 | ForEach-Object { Write-Host "::error::$($_)" }
            exit $code
          }

      - name: 生成 SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Where-Object { $_.Name -notmatch '__uninstaller' } | Select-Object -First 1
          $h = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($exe.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          Write-Host "SHA256 = $h"

      - name: 安装 cosign
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/sigstore/cosign/releases/latest/download/cosign-windows-amd64.exe" -OutFile cosign.exe
          .\cosign.exe version

      - name: Sigstore 签名（keyless）
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Where-Object { $_.Name -notmatch '__uninstaller' } | Select-Object -First 1
          .\cosign.exe sign-blob --yes --bundle "$($exe.FullName).bundle" $exe.FullName

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.bundle
            dist/SHA256SUMS.txt
          generate_release_notes: true
